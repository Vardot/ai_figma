################################################################################
# GitLab CI for the AI Figma module on git.drupalcode.org.
#
# Uses the Drupal GitLabCI template (the DrupalCI replacement), which provides
# composer, PHPCS, PHPStan and PHPUnit jobs across the supported and adjacent
# core versions with no per-project maintenance. See:
#   https://project.pages.drupalcode.org/gitlab_templates/
################################################################################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # Test against adjacent core versions too, not just the current one.
  OPT_IN_TEST_PREVIOUS_MINOR: 1
  OPT_IN_TEST_NEXT_MINOR: 1
  OPT_IN_TEST_NEXT_MAJOR: 1
  OPT_IN_TEST_MAX_PHP: 1
  # No CSS in this module; the webship-js (Playwright + Cucumber) functional
  # suite under tests/ is run separately, not in this pipeline.
  SKIP_STYLELINT: 1
  SKIP_ESLINT: 1

# Blocking quality gates: Drupal + DrupalPractice coding standards and PHPStan.
phpcs:
  allow_failure: false

phpstan:
  allow_failure: false

# Spelling is advisory - a dictionary miss should not block the pipeline.
cspell:
  allow_failure: true

# Build the docs/ folder with MkDocs and publish it to GitLab Pages, served at
# https://project.pages.drupalcode.org/ai_figma/. On merge requests the job just
# builds (validating the docs with --strict); GitLab only publishes Pages from
# the default branch. `--strict` fails the job on a broken link or nav entry.
pages:
  stage: build
  needs: []
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_REF_NAME =~ /^[0-9]+\.[0-9]+\.x$/'
      when: on_success
    - when: never
  script:
    - pip install --no-cache-dir mkdocs-material
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
