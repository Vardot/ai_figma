figma_token_source: key
figma_token_key: figma
figma_api_base: 'https://api.figma.com'
# Default Figma file key (the long id in a figma.com/design/<fileKey>/… URL),
# used when a tool is called without an explicit file key. Empty means a file
# key or link must be supplied each time.
default_file_key: ''
# Editable AI guidance seeded as AI Context items (when the ai_context module is
# present) and read by Figma-aware AI agents. Generic and theme-agnostic - no
# distribution- or theme-specific assumptions.
build_rules: 'Build this design with Drupal Canvas. Editable at Admin → AI → Context ("Figma Build Rules"). COMPONENT MAPPING GOVERNANCE (do this FIRST): (a) read available_components and find the closest existing component for each design section; (b) EXACT MATCH → reuse it as-is and say why it matches (layout, content zones, structure); (c) PARTIAL MATCH → name the closest 1-3 components, describe the differences, and PREFER extending the closest one (add props / variants) over cloning a near-duplicate; (d) NO MATCH → do NOT silently create a new component: tell the user there is no match and propose a new component or a theme/component update, and get approval before scaffolding; (e) report design-vs-theme differences (layer grouping, spacing, font weights, sizes, alignment) and map polish values onto the active theme spacing/type scale, not hard-coded pixels. Then build: (1) REUSE before creating per the governance above; (2) build page parts as SECTIONS - one focused code component per section (hero, cards, stats, CTA), never one monolithic page component; (3) create Canvas pages and place the components in them; (4) header and footer are GLOBAL - reuse the site''s existing system blocks (Site branding, Main navigation, Footer menu, Powered by) in the theme regions; never repeat them inside page components; (5) FORMS = a real Drupal form, never hand-coded HTML - use the core Contact form or an existing Webform; (6) LISTINGS of content (blog, news, events) = reuse the matching content type + its Views listing block, not static cards; bind content components to entities and view modes; (7) map Figma colours onto the active theme''s design tokens / CSS custom properties, not hard-coded hex; (8) name components after what they are ("hero", "stats"), never prefix with "Figma"; (9) fill components with the REAL text from content_texts verbatim (larger sizes = headings, smaller = body/labels), only using placeholder text when content_texts is empty.'
accessibility_rules: 'Every component and text you add MUST be accessible (WCAG 2.1 AA): one logical heading hierarchy (a single h1, then h2/h3 in order - never skip levels or use a heading purely for size); meaningful alt text on every image/icon (empty alt only for decorative ones); real descriptive text on every link and button (no "click here", no empty icon-only controls without an aria-label); text/background contrast >=4.5:1 (>=3:1 for large text) - if a mapped Figma colour fails, pick the theme variant that passes; a visible label on every form field; never convey meaning by colour alone. The result should pass an automated accessibility audit (axe-core) with no serious or critical violations.'
# Optional extra targeted rule (empty in the generic engine). A customization
# layer fills it (e.g. component-mapping governance). Seeded as the
# "Figma Component Mapping Governance" AI Context item when non-empty.
mapping_governance: ''
# Scope applied to the seeded AI Context items: ['<scope_id>' => [values]].
# Generic = global. A setup can target a use case (e.g. working_in_canvas).
context_scope:
  global:
    - global
